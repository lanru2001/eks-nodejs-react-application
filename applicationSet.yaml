apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-mgmt-app
  namespace: default
spec:
  generators:
    - list:
        elements:
          - env: dev
            valuesFile: helm-chart/nodejs-user-app/dev-values.yaml

  template:
    metadata:
      name:  user-mgmt-{{ env }}
    spec:
      project: default
      source:
        repoURL: https://github.com/lanru2001/eks-nodejs-react-application.git
        targetRevision: HEAD
        path: helm-chart/nodejs-user-app
        helm:
          valueFiles:
            - {{ valuesFile }}
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
