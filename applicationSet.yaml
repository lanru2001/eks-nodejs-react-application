apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-mgmt-app
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: https://kubernetes.default.svc
            name: dev
  template:
    metadata:
      name: '{{name}}-user-mgmt-app'
    spec:
      project: default
      source:
        repoURL: https://github.com/lanru2001/eks-nodejs-react-application.git
        targetRevision: HEAD
        path: eks-nodejs-react-application
        helm:
          valueFiles:
            -  helm-chart/nodejs-user-app/dev-values.yaml
      destination:
        server: '{{cluster}}'
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
